openapi: 3.1.0
info:
  title: Touchline FM Chat API
  version: 1.0.0
  description: Read the live game state and queue football-management actions. The game must be open in a browser and connected in Settings.
servers:
  - url: https://REPLACE-WITH-YOUR-DEPLOYED-SERVER
security:
  - bearerAuth: []
paths:
  /api/state:
    get:
      operationId: getGameState
      summary: Read current Touchline FM game state
      responses:
        '200':
          description: Current club, squads, leagues, fixtures and scouting reports
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: updateGameState
      summary: Internal browser heartbeat; do not call manually
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200': { description: Snapshot received }
  /api/action:
    post:
      operationId: queueGameAction
      summary: Queue an action for the open game to execute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  oneOf:
                    - type: object
                      required: [type]
                      properties:
                        type: { const: play_week }
                    - type: object
                      required: [type, weeks]
                      properties:
                        type: { const: advance_weeks }
                        weeks: { type: integer, minimum: 1, maximum: 10 }
                    - type: object
                      required: [type]
                      properties:
                        type: { const: set_tactics }
                        formation: { type: string, enum: ['4-4-2', '4-3-3', '4-2-3-1', '3-5-2', '3-4-2-1', '5-3-2', '4-5-1'] }
                        tactic: { type: string, enum: [balanced, attack, defend] }
                    - type: object
                      required: [type, query]
                      properties:
                        type: { const: search_players }
                        query: { type: string }
                        minOverall: { type: integer, minimum: 0, maximum: 99 }
                        maxAge: { type: integer, minimum: 15, maximum: 99 }
                        limit: { type: integer, minimum: 1, maximum: 50 }
                    - type: object
                      required: [type]
                      properties:
                        type: { const: hire_scout }
                        region: { type: string, maxLength: 40 }
                        stars: { type: integer, minimum: 1, maximum: 5 }
                    - type: object
                      required: [type]
                      properties:
                        type: { const: sign_player }
                        playerId: { type: string }
                        playerName: { type: string }
                        fee: { type: integer, minimum: 0 }
                        yearlyWage: { type: integer, minimum: 0 }
                        years: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '202':
          description: Action queued; use the returned id with GET /api/result/{id}
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  id: { type: string }
                  status: { type: string }
  /api/result/{id}:
    get:
      operationId: getActionResult
      summary: Check whether a queued action has finished
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Action completed, with result or error }
        '202': { description: Action still pending }
