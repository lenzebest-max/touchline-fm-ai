function promo(){const by={};S.leagues.forEach(l=>{(by[l.tier]=by[l.tier]||[]).push(l)});const ts=Object.keys(by).map(Number).sort((a,b)=>a-b),out=[];

function tfmState(){if(!S.user)return {started:false};const teams=Object.values(S.teams).map(t=>({id:t.id,name:t.name,league:(S.leagues.find(l=>l.id===t.lid)||{}).name||'',tier:tierOf(t),money:t.money,overall:Math.round(t.players.reduce((n,id)=>n+ovr(S.players[id]),0)/Math.max(1,t.players.length)),fans:t.fans,stadium:t.stad,players:t.players.map(id=>{const p=S.players[id];return p?{id:p.id,name:p.n,position:p.pos,age:p.age,overall:ovr(p),potential:p.pot,value:p.val,wage:p.wage}:null}).filter(Boolean)}));return {started:true,season:S.season,week:S.week,maxWeeks:S.maxW,userClub:S.user,club:teams.find(t=>t.id===S.user),teams,fixtures:(S.fx[S.week]||[]).map(([home,away])=>({home:S.teams[home]?.name||home,away:S.teams[away]?.name||away})),scoutedPlayers:S.reports.map(id=>S.players[id]).filter(Boolean).map(p=>({id:p.id,name:p.n,position:p.pos,age:p.age,overall:ovr(p),potential:p.pot,estimatedPotential:p.est,value:p.val,wage:p.wage})),pendingDecision:!!S.pend};}
function tfmApplyAction(a){if(!a||typeof a!=='object')throw Error('Action must be an object');const u=S.teams[S.user];if(!u)throw Error('Start a game first');switch(a.type){case 'play_week':play();return {ok:true,message:'Played one week',season:S.season,week:S.week};case 'advance_weeks':{const n=Math.max(1,Math.min(10,Math.floor(Number(a.weeks)||1)));const start=S.week;for(let i=0;i<n;i++)play();return {ok:true,message:'Advanced '+(S.week-start)+' weeks',season:S.season,week:S.week};}case 'set_tactics':{if(a.formation&&!FM[a.formation])throw Error('Invalid formation.');if(a.tactic&&!['balanced','attack','defend'].includes(a.tactic))throw Error('Tactic must be balanced, attack, or defend.');if(a.formation)u.form=a.formation;if(a.tactic)u.tac=a.tactic;save();render();return {ok:true,formation:u.form,tactic:u.tac};}case 'hire_scout':{const starsN=Math.max(1,Math.min(5,Math.floor(Number(a.stars)||1))),cost=scCost(starsN);if(u.money<cost)throw Error('Not enough club money to hire this scout');u.money-=cost;S.scouts.push({region:String(a.region||'Europe').slice(0,40),stars:starsN});save();render();return {ok:true,message:'Scout hired',cost,balance:u.money};}case 'sign_player':{const p=S.players[String(a.playerId)]||Object.values(S.players).find(x=>x.n.toLowerCase()===String(a.playerName||'').toLowerCase());if(!p)throw Error('Player not found; use get state/scouted players to find IDs');if(p.club===S.user)throw Error('Player is already at your club');if(ovr(p)>=90&&(tierOf(u)>1||repOf(u)<70))throw Error('This club cannot attract a 90+ star yet');if(ovr(p)>=85&&tierOf(u)>3)throw Error('Elite players will not join this tier yet');const fee=Math.max(0,Math.floor(Number(a.fee??askP(p))));const salary=Math.max(0,Math.floor(Number(a.yearlyWage??p.wage)));const years=Math.max(1,Math.min(5,Math.floor(Number(a.years)||3)));if(u.money<fee)throw Error('Not enough transfer budget');if(wageBill(u)+salary>wageBudget(u))throw Error('Wage budget would be exceeded');if(salary<p.wage)throw Error('Wage offer is below the player’s asking wage');const old=S.teams[p.club];if(old&&fee<askP(p)*.85)throw Error('Transfer fee is too low; offer at least 85% of asking price');if(old)old.money+=fee;u.money-=fee;moveP(p.id,S.user);p.wage=salary;p.len=years;p.val=val(p);if(fee>(S.hist.fee.fee||0))S.hist.fee={fee,n:p.n};save();render();return {ok:true,message:p.n+' signed',fee,yearlyWage:salary,balance:u.money};}case 'search_players':{const q=String(a.query||'').toLowerCase(),min=Number(a.minOverall)||0,maxAge=Number(a.maxAge)||99;return {ok:true,players:Object.values(S.players).filter(p=>p.club!==S.user&&p.club!=='ret'&&p.club!=='scout'&&(!q||p.n.toLowerCase().includes(q))&&ovr(p)>=min&&p.age<=maxAge).sort((x,y)=>ovr(y)-ovr(x)).slice(0,Math.min(50,Math.max(1,Number(a.limit)||20))).map(p=>({id:p.id,name:p.n,club:S.teams[p.club]?.name||'Free agent',position:p.pos,age:p.age,overall:ovr(p),potential:p.pot,value:p.val,askingFee:askP(p),yearlyWage:p.wage}))};}default:throw Error('Unknown action type');}}
window.TouchlineFMAPI={getState:tfmState,act:tfmApplyAction,version:'1.0'};
function enableTfmApi(){const k=($('#tfm_api_key')||{}).value?.trim();if(!k)return toast('Paste the API key from your server .env');localStorage.setItem('tfm_api_key',k);toast('AI API connected');tfmBridgeTick();render()}
function disableTfmApi(){localStorage.removeItem('tfm_api_key');toast('AI API disconnected');render()}
let tfmBridgeBusy=false;async function tfmBridgeTick(){const key=localStorage.getItem('tfm_api_key');if(!key||tfmBridgeBusy)return;tfmBridgeBusy=true;try{const headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'};await fetch('/api/state',{method:'POST',headers,body:JSON.stringify(tfmState())});const r=await fetch('/api/poll',{headers});if(r.ok){const j=await r.json();if(j.command){let result;try{result={ok:true,data:tfmApplyAction(j.command.action)}}catch(e){result={ok:false,error:String(e.message||e)}}await fetch('/api/result/'+encodeURIComponent(j.command.id),{method:'POST',headers,body:JSON.stringify(result)});}}}catch(e){}finally{tfmBridgeBusy=false}}
setInterval(tfmBridgeTick,1500);window.addEventListener('focus',tfmBridgeTick);
document.addEventListener('click',e=>{if(!e.target.closest('#pop,#nav'))$('#pop').style.display='none'});try{S=JSON.parse(localStorage.getItem('touchlinefm2'))}catch(e){S=null}if(!S||!S.teams)newGame();if(!S.cups)S.cups=[];if(!S.opt)S.opt={recap:1,hints:1};Object.values(S.players||{}).forEach(p=>{p.val=val(p);p.wage=wage(p)});render();
</script></body></html>
